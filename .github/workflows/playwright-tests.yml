name: NativeOffice QA Reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "nativeoffice-qa-pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run QA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        shell: bash
        run: |
          ALLURE_VERSION="2.29.0"
          curl -fsSL \
            -o "$RUNNER_TEMP/allure.zip" \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip"
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin/allure" --version

      - name: Create report directories
        run: |
          RUN_ID="$(date -u +'%Y%m%d-%H%M%S')"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "site/$RUN_ID/allure-results"

      - name: Run test modules
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OVERALL_STATUS=0

          for TEST_FILE in tests/test_*.py; do
            MODULE="$(basename "$TEST_FILE" .py)"
            MODULE_DIR="$GITHUB_WORKSPACE/site/$RUN_ID/$MODULE"
            mkdir -p "$MODULE_DIR/test-results"

            echo "Running: $MODULE"
            REPORT_DIR="$MODULE_DIR" pytest "$TEST_FILE" \
              --alluredir="$GITHUB_WORKSPACE/site/$RUN_ID/allure-results" \
              --output="$MODULE_DIR/test-results"

            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              OVERALL_STATUS=1
            fi
          done

          echo "$OVERALL_STATUS" > "site/$RUN_ID/test-status.txt"

      - name: Generate Allure report
        if: always()
        run: |
          allure generate "site/$RUN_ID/allure-results" \
            --clean \
            --output "site/$RUN_ID/allure-report"

      - name: Set Allure report as Pages entry point
        if: always()
        run: |
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta http-equiv="refresh" content="0; url=$RUN_ID/allure-report/index.html">
            <meta name="robots" content="noindex">
          </head>
          <body>
            Opening the latest Allure report...
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report URL
        if: always()
        run: |
          echo "Allure QA Report:"
          echo "${{ steps.deployment.outputs.page_url }}"
