[pytest]
addopts = --headed --browser-channel=chrome --screenshot=only-on-failure --tracing=retain-on-failure
testpaths = tests
arkers =
    ui: UI and visual behavior
    visual: visual presentation and layout behavior
    functional: functional application behavior
    logic: application logic behavior
    p1: Critical impact / P1
    p3: Medium impact / P3

generate_report_on_test = true

render_collapsed = failed,error

environment_table_redact_list =
    .*PASSWORD.*
    .*TOKEN.*
    .*SECRET.*
    .*KEY.*