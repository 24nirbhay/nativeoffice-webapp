[pytest]
addopts = --browser-channel=chrome --screenshot=only-on-failure --headed
testpaths = tests
markers =
    ui: UI and visual behavior
    visual: visual presentation and layout behavior
    functional: functional application behavior
    logic: application logic behavior
    p1: Critical impact / P1
    p3: Medium impact / P3
    test_case(case_id): stable human test-case identifier

environment_table_redact_list =
    .*PASSWORD.*
    .*TOKEN.*
    .*SECRET.*
    .*KEY.*